<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Museu Literário Digital</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  
  <!-- Google Fonts: Cormorant Garamond & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- PDF.js para ler e converter PDFs automaticamente -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .font-serif {
      font-family: 'Cormorant Garamond', serif;
    }
    .page-container {
      perspective: 2000px;
    }
    .page-flip {
      transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1);
      transform-style: preserve-3d;
      transform-origin: left center;
      backface-visibility: hidden;
    }
    .flipping {
      transform: rotateY(-90deg);
    }
    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
      border-radius: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #4C6444;
      border-radius: 8px;
    }
  </style>
</head>
<body class="bg-[#E5D7C4] dark:bg-[#0f1715] text-[#102820] dark:text-[#E5D7C4] h-screen overflow-hidden flex flex-col lg:flex-row transition-colors duration-300">

  <!-- ==========================================
      MENU LATERAL ESQUERDO
      ========================================== -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-[#102820] dark:bg-[#08120e] text-[#E5D7C4] transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col shadow-2xl border-r border-[#4C6444]/25">
    <div class="p-6 border-b border-[#4C6444]/40 flex items-center justify-between cursor-pointer shrink-0" onclick="switchTab('home')">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-lg bg-[#4C6444] flex items-center justify-center shadow-md shrink-0">
          <i data-lucide="book-open" class="w-6 h-6 text-[#E5D7C4]"></i>
        </div>
        <div>
          <h1 class="font-serif text-lg font-bold tracking-wide text-white leading-tight">Museu Literário</h1>
          <p class="text-[10px] text-[#B3B792] tracking-wider uppercase">Digital & Cultural</p>
        </div>
      </div>
      <button onclick="toggleMobileMenu()" class="lg:hidden text-[#B3B792] hover:text-white p-1">
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>
    </div>

    <!-- Navegação -->
    <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
      <button onclick="switchTab('home')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200" data-tab="home">
        <i data-lucide="book-marked" class="w-5 h-5 shrink-0"></i>
        <span>Início</span>
      </button>
      <button onclick="switchTab('catalog')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200" data-tab="catalog">
        <i data-lucide="library" class="w-5 h-5 shrink-0"></i>
        <span>Acervo Literário</span>
      </button>
      <button onclick="switchTab('gallery')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200" data-tab="gallery">
        <i data-lucide="image" class="w-5 h-5 shrink-0"></i>
        <span>Galeria Fotográfica</span>
      </button>
      <button onclick="switchTab('audiovisual')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200" data-tab="audiovisual">
        <i data-lucide="video" class="w-5 h-5 shrink-0"></i>
        <span>Área Audiovisual</span>
      </button>
      <button onclick="switchTab('about')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200" data-tab="about">
        <i data-lucide="info" class="w-5 h-5 shrink-0"></i>
        <span>Sobre o Museu</span>
      </button>
      <button onclick="switchTab('admin')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200" data-tab="admin">
        <i data-lucide="shield" class="w-5 h-5 shrink-0"></i>
        <span>Painel Administrativo</span>
      </button>
    </nav>

    <div class="p-4 border-t border-[#4C6444]/40 bg-[#0c1f18] dark:bg-[#050b09] text-xs text-[#B3B792] text-center shrink-0">
      <p>© 2026 Museu Literário Digital</p>
    </div>
  </aside>

  <!-- Overlay Mobile -->
  <div id="mobileOverlay" onclick="toggleMobileMenu()" class="fixed inset-0 bg-black/60 z-40 lg:hidden hidden backdrop-blur-sm"></div>

  <!-- ==========================================
      CONTEÚDO PRINCIPAL
      ========================================== -->
  <main class="flex-1 flex flex-col lg:pl-72 h-screen overflow-hidden bg-[#E5D7C4] dark:bg-[#0f1715] w-full">
    
    <!-- Barra Superior -->
    <header class="h-16 bg-[#102820] dark:bg-[#08120e] text-[#E5D7C4] px-6 flex items-center justify-between shadow-md z-30 shrink-0 border-b border-[#4C6444]/20">
      <div class="flex items-center space-x-4 min-w-0">
        <button onclick="toggleMobileMenu()" class="lg:hidden p-2 rounded-lg bg-[#4C6444] text-white focus:outline-none shrink-0">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
        <span id="headerTitle" class="font-serif text-lg font-medium text-white truncate">Página Inicial</span>
      </div>

      <!-- Botão de Alternância de Tema -->
      <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl bg-[#1b3b30] dark:bg-[#152a23] text-[#B3B792] hover:text-white transition shadow-sm flex items-center justify-center" title="Alternar Modo Escuro/Claro">
        <i id="themeIcon" data-lucide="moon" class="w-5 h-5"></i>
      </button>
    </header>

    <!-- Área Rolável Principal -->
    <div id="contentArea" class="flex-1 overflow-y-auto">
      <!-- Conteúdo injetado via JS -->
    </div>
  </main>

  <!-- ==========================================
      MODAL DO LEITOR DE LIVROS
      ========================================== -->
  <div id="pdfReaderModal" class="fixed inset-0 z-50 flex flex-col bg-[#2c221a] dark:bg-[#121816] text-[#F4ECD8] hidden">
    <div id="readerHeader" class="h-16 px-6 flex items-center justify-between border-b border-[#433422] dark:border-[#222c27] bg-[#1a130f] dark:bg-[#0a0f0d] shrink-0">
      <div class="overflow-hidden pr-2 min-w-0">
        <h3 id="readerBookTitle" class="font-serif font-bold text-base truncate">Título da Obra</h3>
        <p id="readerBookAuthor" class="text-xs opacity-75 truncate">Autor</p>
      </div>
      <div class="flex items-center space-x-3 shrink-0">
        <span id="pageIndicator" class="hidden sm:inline-block text-xs font-mono bg-black/30 px-3 py-1 rounded-lg">Página 1 de 3</span>
        <button onclick="closePdfReader()" id="closeReaderBtn" class="bg-red-600 text-white p-2.5 rounded-xl hover:bg-red-700 transition flex items-center justify-center">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
    
    <div id="readerBodyContainer" class="flex-1 flex items-center justify-center p-4 sm:p-8 page-container overflow-hidden w-full h-full"></div>
  </div>

  <!-- ==========================================
      MODAL DE FOTO EM TELA CHEIA
      ========================================== -->
  <div id="photoModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 p-4 hidden backdrop-blur-md" onclick="closePhotoModal()">
    <div class="relative max-w-5xl max-h-[90vh] w-full flex flex-col items-center" onclick="event.stopPropagation()">
      <button onclick="closePhotoModal()" class="absolute -top-12 right-0 text-white bg-white/10 hover:bg-white/20 p-2 rounded-full transition">
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>
      <img id="modalPhotoImg" src="" class="max-w-full max-h-[75vh] object-contain rounded-2xl shadow-2xl border border-white/10">
      <div class="mt-4 text-center text-white">
        <h3 id="modalPhotoTitle" class="font-serif text-xl font-bold"></h3>
        <p id="modalPhotoDesc" class="text-sm text-gray-300 mt-1 max-w-xl"></p>
      </div>
    </div>
  </div>

  <!-- ==========================================
      SCRIPT DO FIREBASE E APLICAÇÃO
      ========================================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { getDatabase, ref, set, get, remove, push, onValue } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

    // Sua configuração oficial do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyD_CIISlRS5yyjXM26Z07Po7YlNMAq2tdY",
      authDomain: "muse-literario-digital.firebaseapp.com",
      databaseURL: "https://muse-literario-digital-default-rtdb.firebaseio.com",
      projectId: "muse-literario-digital",
      storageBucket: "muse-literario-digital.firebasestorage.app",
      messagingSenderId: "29538710467",
      appId: "1:29538710467:web:a802fc2ae5c7b710a14376"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    // Disponibiliza as ferramentas do Firebase globalmente de forma limpa
    window.dbAPI = {
      database,
      ref,
      set,
      get,
      remove,
      push,
      onValue
    };
  </script>

  <script>
    const defaultBooks = [
      {
        id: '1',
        title: 'Crônicas da Terra Vermelha',
        subtitle: 'Memórias e paisagens do interior',
        author: 'Mariana Silva',
        synopsis: 'Uma coletânea sensível de crônicas sobre a infância no interior, os cheiros da terra molhada, as tardes de outono e a sabedoria dos antigos.',
        category: 'Crônica',
        year: '2025',
        coverUrl: 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=600',
        pdfUrl: '',
        externalLink: '',
        status: 'published',
        featured: true,
        shelf: 'Crônicas',
        pages: [
          "Capítulo I\n\nA terra vermelha guardava os segredos das primeiras chuvas de novembro. Quando o cheiro de mato molhado subia pelo vale, sabíamos que o tempo havia mudado de ritmo.",
          "As tardes eram longas na varanda da casa de vó. Entre um gole de café coado na hora e histórias contadas à sombra da mangueira, o mundo lá fora parecia distante e seguro.",
          "Hoje, mesmo longe daquela paisagem, basta fechar os olhos para ouvir o vento balançar os cafezais. As raízes que lá deixamos continuam a nutrir quem somos."
        ]
      }
    ];

    const state = {
      activeTab: 'home',
      isAdminAuth: false,
      adminSubTab: 'books',
      searchTerm: '',
      selectedCategoryFilter: 'all',
      selectedBookId: null,
      currentPage: 1,
      totalPages: 1,
      isDarkMode: localStorage.getItem('museu_dark') === 'true',
      books: defaultBooks,
      categories: ['Conto', 'Crônica', 'Poesia', 'Literatura nordestina', 'Produção escolar', 'Romance'],
      gallery: [
        { id: '1', title: 'Oficina de Contação de Histórias', description: 'Alunos reunidos na biblioteca ao ar livre compartilhando leituras.', imageUrl: 'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&q=80&w=1200', date: 'Agosto, 2026', project: 'Festival' }
      ],
      videos: [
        { id: '1', title: 'Documentário: Vozes da Terra', description: 'Panorama sobre literatura oral e contadores de causos.', videoUrl: 'https://www.youtube.com/embed/dQw4w9WgXcQ', category: 'Documentário' }
      ]
    };

    const shelvesConfig = [
      { title: 'Obras em destaque', shelfName: 'Obras em destaque' },
      { title: 'Crônicas', shelfName: 'Crônicas' },
      { title: 'Literatura nordestina', shelfName: 'Literatura nordestina' },
      { title: 'Novas publicações', shelfName: 'Novas publicações' }
    ];

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Carregamento e sincronização em tempo real via Firebase Realtime Database
    function initFirebaseSync() {
      if (!window.dbAPI) return;
      const { database, ref, onValue } = window.dbAPI;

      onValue(ref(database, 'books'), (snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          state.books = Object.entries(data).map(([id, val]) => ({ ...val, id }));
          render();
        }
      });

      onValue(ref(database, 'categories'), (snapshot) => {
        if (snapshot.exists()) {
          state.categories = snapshot.val();
          render();
        }
      });

      onValue(ref(database, 'gallery'), (snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          state.gallery = Object.entries(data).map(([id, val]) => ({ ...val, id }));
          render();
        }
      });

      onValue(ref(database, 'videos'), (snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          state.videos = Object.entries(data).map(([id, val]) => ({ ...val, id }));
          render();
        }
      });
    }

    function switchTab(tab) {
      state.activeTab = tab;
      render();
      closeMobileMenu();
    }

    function toggleMobileMenu() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('mobileOverlay');
      if(sidebar) sidebar.classList.toggle('-translate-x-full');
      if(overlay) overlay.classList.toggle('hidden');
    }

    function closeMobileMenu() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('mobileOverlay');
      if(sidebar) sidebar.classList.add('-translate-x-full');
      if(overlay) overlay.classList.add('hidden');
    }

    function toggleDarkMode() {
      state.isDarkMode = !state.isDarkMode;
      localStorage.setItem('museu_dark', state.isDarkMode);
      applyTheme();
    }

    function applyTheme() {
      const htmlElem = document.documentElement;
      const themeIcon = document.getElementById('themeIcon');
      
      if (state.isDarkMode) {
        htmlElem.classList.add('dark');
        if(themeIcon) themeIcon.setAttribute('data-lucide', 'sun');
      } else {
        htmlElem.classList.remove('dark');
        if(themeIcon) themeIcon.setAttribute('data-lucide', 'moon');
      }
      if(typeof lucide !== 'undefined') lucide.createIcons();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMobileMenu();
        closePdfReader();
        closePhotoModal();
      }
    });

    function render() {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const tab = btn.getAttribute('data-tab');
        if (tab === state.activeTab || (state.activeTab === 'book-detail' && tab === 'catalog')) {
          btn.className = 'nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium bg-[#4C6444] text-white shadow-md';
        } else {
          btn.className = 'nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-[#B3B792] hover:bg-[#15352a] hover:text-white dark:hover:bg-[#152721] transition-all';
        }
      });

      const titles = {
        home: 'Página Inicial',
        catalog: 'Acervo Literário',
        'book-detail': 'Detalhes da Obra',
        gallery: 'Galeria Fotográfica',
        audiovisual: 'Área Audiovisual',
        about: 'Sobre o Projeto',
        admin: 'Painel Administrativo'
      };
      
      const headerTitle = document.getElementById('headerTitle');
      if(headerTitle) headerTitle.textContent = titles[state.activeTab] || 'Museu Literário';

      const area = document.getElementById('contentArea');
      if(!area) return;
      area.innerHTML = '';

      if (state.activeTab === 'home') area.innerHTML = renderHome();
      else if (state.activeTab === 'catalog') area.innerHTML = renderCatalog();
      else if (state.activeTab === 'book-detail') area.innerHTML = renderBookDetail();
      else if (state.activeTab === 'gallery') area.innerHTML = renderGallery();
      else if (state.activeTab === 'audiovisual') area.innerHTML = renderAudiovisual();
      else if (state.activeTab === 'about') area.innerHTML = renderAbout();
      else if (state.activeTab === 'admin') area.innerHTML = renderAdmin();

      if(typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    }

    function renderHome() {
      let shelvesHtml = shelvesConfig.map(shelf => {
        const shelfBooks = state.books.filter(b => b.status === 'published' && (b.shelf === shelf.shelfName || (shelf.shelfName === 'Obras em destaque' && b.featured)));
        if (shelfBooks.length === 0) return '';

        let booksCards = shelfBooks.map(book => `
          <div class="w-56 sm:w-64 lg:w-72 shrink-0 bg-[#F4EFE6] dark:bg-[#16221d] rounded-3xl shadow-xl overflow-hidden border border-[#CFBB99]/80 dark:border-[#263830] flex flex-col group hover:shadow-2xl transition duration-300">
            <div class="relative h-64 sm:h-72 lg:h-80 overflow-hidden bg-[#d3c1a5] dark:bg-[#101915]">
              <img src="${escapeHtml(book.coverUrl)}" alt="${escapeHtml(book.title)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
              <div class="absolute top-3 left-3 bg-[#102820]/90 text-[#E5D7C4] text-[10px] sm:text-xs px-3 py-1 rounded-full font-semibold uppercase tracking-wider">
                ${escapeHtml(book.category)}
              </div>
            </div>
            <div class="p-4 sm:p-5 flex-1 flex flex-col justify-between">
              <div>
                <h3 class="font-serif font-bold text-base sm:text-lg lg:text-xl text-[#102820] dark:text-[#F4ECD8] line-clamp-1">${escapeHtml(book.title)}</h3>
                <p class="text-xs sm:text-sm text-[#8A6240] dark:text-[#bca282] font-medium mt-1 line-clamp-1">${escapeHtml(book.author)}</p>
              </div>
              <div class="mt-4 pt-3 border-t border-[#CFBB99]/50 dark:border-[#263830] flex items-center justify-between">
                <span class="text-xs text-[#889063] font-bold">${escapeHtml(book.year)}</span>
                <button onclick="openBook('${book.id}')" class="bg-[#4C6444] hover:bg-[#394c33] text-white text-xs px-3.5 py-2 rounded-xl font-medium transition shadow">
                  Ler Obra
                </button>
              </div>
            </div>
          </div>
        `).join('');

        return `
          <div class="space-y-4 w-full overflow-hidden">
            <div class="flex items-center justify-between border-b border-[#889063]/30 pb-3">
              <h2 class="text-lg sm:text-2xl font-serif font-bold text-[#102820] dark:text-[#E5D7C4] flex items-center space-x-2.5 truncate pr-2">
                <span class="w-3 h-3 rounded-full bg-[#4C6444] shrink-0"></span>
                <span class="truncate">${escapeHtml(shelf.title)}</span>
              </h2>
            </div>
            <div class="flex space-x-4 sm:space-x-6 overflow-x-auto pb-4 pt-2 custom-scrollbar w-full">
              ${booksCards}
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="min-h-full flex flex-col pb-28 lg:pb-12 w-full overflow-x-hidden">
          <div class="bg-[#102820] dark:bg-[#070e0b] text-white py-14 sm:py-20 lg:py-24 px-6 sm:px-12 flex flex-col items-center justify-center text-center shadow-2xl">
            <h1 class="text-2xl sm:text-4xl lg:text-6xl font-serif font-bold text-[#E5D7C4] leading-tight max-w-3xl">
              “Um lugar para as histórias viverem.”
            </h1>
            <p class="text-xs sm:text-base lg:text-lg text-[#B3B792] font-light max-w-xl mx-auto mt-4">
              Explore livros, poemas e memórias que atravessam gerações com elegância e imersão.
            </p>
            <button onclick="switchTab('catalog')" class="mt-8 bg-[#4C6444] hover:bg-[#5d7954] text-white px-7 py-3 rounded-2xl font-medium shadow-xl transition text-sm sm:text-base">
              Explorar Acervo Completo
            </button>
          </div>
          <div class="py-8 sm:py-12 px-4 sm:px-8 lg:px-16 space-y-10 max-w-[1400px] mx-auto w-full">
            ${shelvesHtml}
          </div>
        </div>
      `;
    }

    function renderCatalog() {
      let categoriesBtns = `<button onclick="setCategoryFilter('all')" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold shadow-sm shrink-0 ${state.selectedCategoryFilter === 'all' ? 'bg-[#102820] dark:bg-[#20362e] text-white' : 'bg-[#F4EFE6] dark:bg-[#16221d] text-[#4D2D18] dark:text-[#d1bfa7]'}">Todas</button>`;
      categoriesBtns += state.categories.map(c => `
        <button onclick="setCategoryFilter('${c}')" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold shadow-sm shrink-0 ${state.selectedCategoryFilter === c ? 'bg-[#102820] dark:bg-[#20362e] text-white' : 'bg-[#F4EFE6] dark:bg-[#16221d] text-[#4D2D18] dark:text-[#d1bfa7]'}">${escapeHtml(c)}</button>
      `).join('');

      return `
        <div class="p-6 sm:p-10 lg:p-16 max-w-[1400px] mx-auto space-y-8 pb-32 lg:pb-12">
          <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
              <h1 class="text-2xl sm:text-4xl font-serif font-bold text-[#102820] dark:text-[#E5D7C4]">Acervo Literário</h1>
              <p class="text-sm text-[#4D2D18] dark:text-[#bca282] mt-1">Pesquise por título, autor, sinopse ou categoria.</p>
            </div>
            <div class="relative w-full md:w-96">
              <i data-lucide="search" class="absolute left-4 top-3.5 w-4 h-4 text-[#8A6240] dark:text-[#bca282]"></i>

    function getFilteredBooksHTML() {

      let filtered = state.books.filter(b => b.status === 'published')

          book.title.toLowerCase().includes(termo) ||
          book.author.toLowerCase().includes(termo) ||
          (book.subtitle || '').toLowerCase().includes(termo) ||
          (book.synopsis || '').toLowerCase().includes(termo) ||
          book.category.toLowerCase().includes(termo)
        );

      if (filtered.length === 0) return `<div class="col-span-full py-16 text-center text-sm text-[#8A6240] dark:text-[#bca282]">Nenhuma obra encontrada com os critérios informados.</div>`;

              <span class="text-xs text-[#889063] font-bold">${escapeHtml(book.year)}</span>

    function handleCoverFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('fCover').value = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function handlePdfFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const statusMsg = document.getElementById('pdfStatusMsg');
      statusMsg.textContent = "Lendo e convertendo PDF em obra literária...";
      statusMsg.className = "text-[10px] text-amber-600 font-semibold mt-1";

      try {
        const arrayBuffer = await file.arrayBuffer();
        const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
        const pdfDoc = await loadingTask.promise;

        let extractedPages = [];
        for (let i = 1; i <= pdfDoc.numPages; i++) {
          const page = await pdfDoc.getPage(i);
          const textContent = await page.getTextContent();
          const pageText = textContent.items.map(item => item.str).join(' ');
          if (pageText.trim()) {
            extractedPages.push(pageText);
          }
        }

        if (extractedPages.length === 0) {
          extractedPages = ["Documento PDF convertido sem texto extraível direto."];
        }

        document.getElementById('fPages').value = extractedPages.join('\n\n');
        
        const titleInput = document.getElementById('fTitle');
        if (!titleInput.value) {
          titleInput.value = file.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
        }

        statusMsg.textContent = `PDF convertido com sucesso! (${pdfDoc.numPages} páginas estruturadas).`;
        statusMsg.className = "text-[10px] text-emerald-600 font-semibold mt-1";
      } catch (err) {
        console.error("Erro ao converter PDF:", err);
        statusMsg.textContent = "Erro ao processar o arquivo PDF. Tente outro arquivo.";
        statusMsg.className = "text-[10px] text-red-600 font-semibold mt-1";
      }
    }

    function renderAdminGallery() {

              <input id="gDate" placeholder="Data (ex: Outubro, 2026)" value="Outubro, 2026" class="w-full bg-white dark:bg-[#101915] text-[#102820] dark:text-[#E5D7C4] border border-[#CFBB99] dark:border-[#263830] rounded-xl px-3.5 py-2.5 text-xs focus:outline-none">

              <button type="submit" class="w-full bg-[#4C6444] text-white py-3 rounded-xl text-xs font-semibold shadow">Salvar Fotografia</button>
            </form>
          </div>
          <div class="lg:col-span-2 bg-[#F4EFE6] dark:bg-[#16221d] p-6 sm:p-8 rounded-3xl shadow-xl border border-[#CFBB99] dark:border-[#263830] space-y-4">

            <div class="space-y-3 max-h-[500px] overflow-y-auto">${galleryList}</div>
          </div>
        </div>
      `;
    }

              <input id="vUrl" placeholder="URL do YouTube Embed (ex: https://www.youtube.com/embed/...) *" class="w-full bg-white dark:bg-[#101915] text-[#102820] dark:text-[#E5D7C4] border border-[#CFBB99] dark:border-[#263830] rounded-xl px-3.5 py-2.5 text-xs focus:outline-none" required>
              <input id="vCategory" placeholder="Categoria (ex: Documentário)" value="Documentário" class="w-full bg-white dark:bg-[#101915] text-[#102820] dark:text-[#E5D7C4] border border-[#CFBB99] dark:border-[#263830] rounded-xl px-3.5 py-2.5 text-xs focus:outline-none">
              <textarea id="vDesc" placeholder="Descrição do vídeo" class="w-full bg-white dark:bg-[#101915] text-[#102820] dark:text-[#E5D7C4] border border-[#CFBB99] dark:border-[#263830] rounded-xl px-3.5 py-2.5 text-xs focus:outline-none h-20"></textarea>

    function renderAdminCategories() {
      let categoriesList = state.categories.map(c => `
        <div class="bg-white dark:bg-[#101915] p-4 rounded-2xl border border-[#CFBB99] dark:border-[#263830] flex items-center justify-between shadow-sm">
          <span class="font-serif font-bold text-sm text-[#102820] dark:text-[#F4ECD8]">${escapeHtml(c)}</span>
          <button onclick="deleteCategory('${escapeHtml(c)}')" class="p-2 bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-300 rounded-xl shrink-0"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </div>
      `).join('');

      return `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <div class="bg-[#F4EFE6] dark:bg-[#16221d] p-6 sm:p-8 rounded-3xl shadow-xl border border-[#CFBB99] dark:border-[#263830] space-y-4">
            <h3 class="font-serif font-bold text-lg text-[#102820] dark:text-[#E5D7C4]">Adicionar Nova Categoria / Gênero</h3>
            <form id="categoryForm" onsubmit="handleSaveCategory(event)" class="space-y-3">
              <input id="cName" placeholder="Nome da Categoria (ex: Ensaio) *" class="w-full bg-white dark:bg-[#101915] text-[#102820] dark:text-[#E5D7C4] border border-[#CFBB99] dark:border-[#263830] rounded-xl px-3.5 py-2.5 text-xs focus:outline-none" required>
              <button type="submit" class="w-full bg-[#4C6444] text-white py-3 rounded-xl text-xs font-semibold shadow">Adicionar Categoria</button>
            </form>
          </div>
          <div class="lg:col-span-2 bg-[#F4EFE6] dark:bg-[#16221d] p-6 sm:p-8 rounded-3xl shadow-xl border border-[#CFBB99] dark:border-[#263830] space-y-4">
            <h3 class="font-serif font-bold text-lg text-[#102820] dark:text-[#E5D7C4]">Categorias Existentes (${state.categories.length})</h3>
            <div class="space-y-3 max-h-[500px] overflow-y-auto">${categoriesList}</div>
          </div>
        </div>
      `;
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      const inputPass = document.getElementById('adminPassInput').value;
      const senhaSecreta = "admin123";
      if (inputPass === senhaSecreta) {
        state.isAdminAuth = true;
        render();
      } else {
        alert('Senha incorreta!');
      }
    }

    async function handleSaveBook(e) {
      e.preventDefault();
      const rawPages = document.getElementById('fPages').value.trim();
      const pagesArray = rawPages ? rawPages.split(/\n\s*\n/) : ["Página inicial da obra.", "Conteúdo e desenvolvimento.", "Conclusão."];

      const newBook = {
        title: document.getElementById('fTitle').value,
        subtitle: document.getElementById('fSubtitle').value,
        author: document.getElementById('fAuthor').value,
        category: document.getElementById('fCategory').value,
        year: document.getElementById('fYear').value || '2026',
        synopsis: document.getElementById('fSynopsis').value,
        coverUrl: document.getElementById('fCover').value || 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=600',
        pdfUrl: '',
        externalLink: document.getElementById('fExternalLink').value.trim(),
        status: 'published',
        featured: document.getElementById('fFeatured').checked,
        shelf: document.getElementById('fFeatured').checked ? 'Obras em destaque' : 'Novas publicações',
        pages: pagesArray
      };

      const { database, ref, push, set } = window.dbAPI;
      const newRef = push(ref(database, 'books'));
      await set(newRef, newBook);

      alert('Obra convertida e cadastrada com sucesso no acervo!');
      document.getElementById('bookForm').reset();
      render();
    }

    async function deleteBook(id) {
      if (confirm('Deseja excluir esta obra do acervo?')) {
        const { database, ref, remove } = window.dbAPI;
        await remove(ref(database, 'books/' + id));
        render();
      }
    }

    async function handleSaveGallery(e) {
      e.preventDefault();
      const newItem = {
        title: document.getElementById('gTitle').value,
        imageUrl: document.getElementById('gImageUrl').value,
        date: document.getElementById('gDate').value,
        project: document.getElementById('gProject').value,
        description: document.getElementById('gDesc').value
      };
      const { database, ref, push, set } = window.dbAPI;
      const newRef = push(ref(database, 'gallery'));
      await set(newRef, newItem);

      alert('Fotografia cadastrada com sucesso!');
      document.getElementById('galleryForm').reset();
      render();
    }

    async function deleteGalleryItem(id) {
      if (confirm('Deseja excluir esta foto?')) {
        const { database, ref, remove } = window.dbAPI;
        await remove(ref(database, 'gallery/' + id));
        render();
      }
    }

    async function handleSaveVideo(e) {
      e.preventDefault();
      const newItem = {
        title: document.getElementById('vTitle').value,
        videoUrl: document.getElementById('vUrl').value,
        category: document.getElementById('vCategory').value,
        description: document.getElementById('vDesc').value
      };
      const { database, ref, push, set } = window.dbAPI;
      const newRef = push(ref(database, 'videos'));
      await set(newRef, newItem);

      alert('Vídeo cadastrado com sucesso!');
      document.getElementById('videoForm').reset();
      render();
    }

    async function deleteVideoItem(id) {
      if (confirm('Deseja excluir este vídeo?')) {
        const { database, ref, remove } = window.dbAPI;
        await remove(ref(database, 'videos/' + id));
        render();
      }
    }

    async function handleSaveCategory(e) {
      e.preventDefault();
      const catName = document.getElementById('cName').value.trim();
      if (catName && !state.categories.includes(catName)) {
        state.categories.push(catName);
        const { database, ref, set } = window.dbAPI;
        await set(ref(database, 'categories'), state.categories);

        alert('Categoria adicionada com sucesso!');
        document.getElementById('categoryForm').reset();
        render();
      } else {
        alert('Categoria já existe ou está vazia.');
      }
    }

    async function deleteCategory(catName) {
      if (confirm(`Deseja excluir a categoria "${catName}"?`)) {
        state.categories = state.categories.filter(c => c !== catName);
        const { database, ref, set } = window.dbAPI;
        await set(ref(database, 'categories'), state.categories);
        render();
      }
    }

    function openBook(id) {
      state.selectedBookId = id;
      switchTab('book-detail');
    }

    function setCategoryFilter(cat) {
      state.selectedCategoryFilter = cat;
      render();
    }

    function openPdfReader(bookId) {
      const book = state.books.find(b => b.id === bookId);
      if (!book) return;
      
      state.currentReadingBook = book;
      document.getElementById('readerBookTitle').textContent = book.title;
      document.getElementById('readerBookAuthor').textContent = book.author;

      const bodyContainer = document.getElementById('readerBodyContainer');
      bodyContainer.innerHTML = '';

      if (book.pages && book.pages.length > 0) {
        document.getElementById('pageIndicator').style.display = 'inline-block';
        state.currentPage = 1;
        state.totalPages = book.pages.length;

        bodyContainer.innerHTML = `
          <div id="bookPageContainer" class="page-flip w-full h-full max-w-4xl bg-[#F9F3EA] dark:bg-[#141c19] text-[#2c221a] dark:text-[#E5D7C4] p-6 sm:p-16 rounded-2xl shadow-2xl border-l-8 border-[#102820] dark:border-[#263830] flex flex-col justify-between overflow-y-auto">
            <div class="border-b border-[#dcd0bc] dark:border-[#263830] pb-4 mb-6 flex justify-between items-center shrink-0">
              <span class="font-serif italic text-sm text-[#8A6240] dark:text-[#bca282] truncate pr-2">${escapeHtml(book.title)}</span>
              <span class="text-xs text-gray-500 dark:text-gray-400 font-mono shrink-0" id="topPageNum">1</span>
            </div>

            <div id="pageContentText" class="flex-1 font-serif text-lg sm:text-2xl leading-relaxed space-y-4 my-auto"></div>

            <div class="pt-6 border-t border-[#dcd0bc] dark:borderdark:border-[#263830] flex justify-between items-center mt-6 shrink-0">
              <button onclick="changePage(-1)" class="px-5 py-2.5 bg-[#4C6444] text-white rounded-xl text-sm font-medium hover:bg-[#394c33] transition flex items-center space-x-2 shadow">
                <i data-lucide="chevron-left" class="w-4 h-4"></i><span>Anterior</span>
              </button>
              <span id="bottomPageNum" class="text-xs text-gray-600 dark:text-gray-400 font-bold">1 / ${state.totalPages}</span>
              <button onclick="changePage(1)" class="px-5 py-2.5 bg-[#4C6444] text-white rounded-xl text-sm font-medium hover:bg-[#394c33] transition flex items-center space-x-2 shadow">
                <span>Próxima</span><i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        `;
        updateReaderPageContent();
      } else {
        bodyContainer.innerHTML = `<div class="text-center text-white p-8">O conteúdo desta obra ainda não está disponível para leitura.</div>`;
      }

      document.getElementById('pdfReaderModal').classList.remove('hidden');
      document.getElementById('closeReaderBtn').focus();
    }

    function closePdfReader() {
      document.getElementById('pdfReaderModal').classList.add('hidden');
      document.getElementById('readerBodyContainer').innerHTML = '';
    }

    function changePage(direction) {
      const newPage = state.currentPage + direction;
      if (newPage < 1 || newPage > state.totalPages) return;

      const container = document.getElementById('bookPageContainer');
      if (!container) return;

      container.classList.add('flipping');

      setTimeout(() => {
        state.currentPage = newPage;
        updateReaderPageContent();
        container.classList.remove('flipping');
      }, 300);
    }

    function updateReaderPageContent() {
      const book = state.currentReadingBook;
      const text = book.pages && book.pages[state.currentPage - 1] ? book.pages[state.currentPage - 1] : `Página ${state.currentPage}`;
      
      const contentElem = document.getElementById('pageContentText');
      if (contentElem) {
        contentElem.innerHTML = `<p>${escapeHtml(text).replace(/\n\n/g, '</p><p>')}</p>`;
      }
      const topNum = document.getElementById('topPageNum');
      if (topNum) topNum.textContent = state.currentPage;

      const botNum = document.getElementById('bottomPageNum');
      if (botNum) botNum.textContent = `${state.currentPage} / ${state.totalPages}`;

      const indicator = document.getElementById('pageIndicator');
      if (indicator) indicator.textContent = `Página ${state.currentPage} de ${state.totalPages}`;
      
      if(typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    }

    function openPhotoModal(url, title, desc) {
      document.getElementById('modalPhotoImg').src = decodeURIComponent(url);
      document.getElementById('modalPhotoTitle').textContent = decodeURIComponent(title);
      document.getElementById('modalPhotoDesc').textContent = decodeURIComponent(desc);
      document.getElementById('photoModal').classList.remove('hidden');
    }

    function closePhotoModal() {
      document.getElementById('photoModal').classList.add('hidden');
      document.getElementById('modalPhotoImg').src = '';
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyTheme();
      render();
      setTimeout(() => {
        initFirebaseSync();
      }, 150);
    });
  </script>
</body>
